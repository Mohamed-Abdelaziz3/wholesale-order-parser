# fly.toml — single small instance is plenty for a pilot.
# Deploy: fly launch --no-deploy && fly volumes create wop_data --size 1 && fly deploy
app = "wholesale-order-parser"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  SESSION_HTTPS_ONLY = "true"
  ORDERS_DB_PATH = "/app/data/orders.db"

[[mounts]]
  source = "wop_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"
