name: Feature request
description: Suggest an improvement to the product or developer experience
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior, not just an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Human-review and security impact
      description: Could this affect review, authorization, audit records, or exports?
    validations:
      required: true
